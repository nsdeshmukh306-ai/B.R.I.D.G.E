[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-spatial"
version = "0.1.0"
description = "BRIDGE — Universal Spatial AI Projection Platform (camera + projector + AI reasoning on physical surfaces)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BRIDGE contributors" }]
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",
    "PySide6>=6.6",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "screeninfo>=0.8",
    "sounddevice>=0.4",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]
hands = ["mediapipe>=0.10"]
offline-stt = ["faster-whisper>=1.0"]

[project.scripts]
bridge = "bridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
