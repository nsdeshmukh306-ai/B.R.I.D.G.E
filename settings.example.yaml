mode: physical
profiles_dir: profiles
log_dir: logs
log_level: INFO
camera:
  preferred_device: null
  width: 1280
  height: 720
  fps: 30
  auto_exposure: true        # false + exposure below keeps the frame rate up in a dark room
  exposure: null             # DirectShow units, e.g. -6 is about 1/60 s
projector:
  preferred_display: null
calibration:
  method: planar_9point
  validation_threshold_px: 6.0   # camera pixels
  marker_radius_px: 28
  margin_fraction: 0.12
  detection_min_confidence: 0.6
  max_retries: 3
tracking:
  enabled: true
  process_width: 640         # detection/tracking run on a frame downscaled to this width
  smoothing: true            # 60 fps motion smoothing + latency compensation
  lead_ms: 60                # how far ahead the graphic is predicted (camera + processing latency)
  backend: csrt
  lost_after_frames: 15
  min_confidence: 0.3
ai:
  provider: gemini
  model: gemini-3.6-flash
  min_confidence: 0.5
  timeout_s: 30.0
  budget_inr: 500.0          # soft spend cap for this run; match your loaded API credit. null/0 disables it
  usd_to_inr: 88.0           # approximate manual FX rate used only for the cap above — not live-fetched
recognizer:
  # A specialist, local, offline instrument-recognition model. Off by default —
  # nothing is bundled. See docs/recognition.md before pointing this at a
  # downloaded model: pretrained surgical-instrument weights evaluated during
  # development are non-commercially licensed and are not a fit for a paid
  # deployment without either a separate licence or your own trained weights.
  enabled: false
  weights_path: null         # path to a YOLO-family .onnx export
  labels_path: null          # one class name per line, in the model's training order
  conf_threshold: 0.45
  iou_threshold: 0.45
  input_size: 640
render:
  background: black          # projector emits only the graphics
  target_style: pulse
  accent_rgb: [0, 220, 200]
  line_width: 3
  fps: 60
voice:
  enabled: true              # start listening when calibration is valid (physical mode)
  stt_provider: whisper      # whisper (offline, pip install faster-whisper, default) | gemini | mock
  tts_enabled: true
  tts_rate: 175
  tts_voice: null            # substring of an installed voice name
  wake_word: bridge
  require_wake_word: false
  mic_device: null           # null = this computer's default microphone
  barge_in: true             # speaking over BRIDGE cuts it off mid-sentence
  vad_threshold: 0.012
  silence_ms: 800
  max_utterance_s: 12.0
assistant:
  enabled: true              # the always-on surgical assistant (scene memory, counts, case, alerts)
  proactive: true            # BRIDGE may speak first when something is wrong
  scan_hz: 5.0               # scene-graph updates per second (local CV, no AI)
  ai_label_interval_s: 12.0  # how often BRIDGE checks for anything unlabelled/uncertain to name (not
                              # a blind timer: skipped entirely once the tray is fully labelled and stable)
  ai_relabel_interval_s: 90.0  # staleness safety net: force a re-check this often regardless
  monitor_interval_s: 1.0
  show_count_board: true     # project the live count board onto the surface
  records_dir: case_records
surgical:
  default_set: minor         # minor | laparotomy | suture_tray | central_line, or your own in sets/
  sharp_grace_s: 20.0        # a sharp off the tray this long earns a warning
  field_item_grace_s: 45.0
  absence_grace_s: 6.0       # how long something must be unseen before it counts as missing
  alert_cooldown_s: 45.0
domain: healthcare
