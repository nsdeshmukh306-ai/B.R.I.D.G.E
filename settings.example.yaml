mode: physical
profiles_dir: profiles
log_dir: logs
log_level: INFO
camera:
  preferred_device: null
  width: 1280
  height: 720
  fps: 30
  auto_exposure: true        # false + exposure below keeps the frame rate up in a dark room
  exposure: null             # DirectShow units, e.g. -6 is about 1/60 s
projector:
  preferred_display: null
calibration:
  method: planar_9point
  validation_threshold_px: 6.0   # camera pixels
  marker_radius_px: 28
  margin_fraction: 0.12
  detection_min_confidence: 0.6
  max_retries: 3
tracking:
  enabled: true
  process_width: 640         # detection/tracking run on a frame downscaled to this width
  smoothing: true            # 60 fps motion smoothing + latency compensation
  lead_ms: 60                # how far ahead the graphic is predicted (camera + processing latency)
  backend: csrt
  lost_after_frames: 15
  min_confidence: 0.3
ai:
  provider: gemini
  model: gemini-2.5-flash
  min_confidence: 0.5
  timeout_s: 30.0
render:
  background: black          # projector emits only the graphics
  target_style: pulse
  accent_rgb: [0, 220, 200]
  line_width: 3
  fps: 60
voice:
  enabled: true              # start listening when calibration is valid (physical mode)
  stt_provider: gemini       # gemini | whisper (offline, pip install faster-whisper) | mock
  tts_enabled: true
  tts_rate: 175
  tts_voice: null            # substring of an installed voice name
  wake_word: bridge
  require_wake_word: false
  mic_device: null           # null = this computer's default microphone
  barge_in: true             # speaking over BRIDGE cuts it off mid-sentence
  vad_threshold: 0.012
  silence_ms: 800
  max_utterance_s: 12.0
assistant:
  enabled: true              # the always-on surgical assistant (scene memory, counts, case, alerts)
  proactive: true            # BRIDGE may speak first when something is wrong
  scan_hz: 5.0               # scene-graph updates per second (local CV, no AI)
  ai_label_interval_s: 12.0  # how often the model is asked to name what it sees
  monitor_interval_s: 1.0
  show_count_board: true     # project the live count board onto the surface
  records_dir: case_records
surgical:
  default_set: minor         # minor | laparotomy | suture_tray | central_line, or your own in sets/
  sharp_grace_s: 20.0        # a sharp off the tray this long earns a warning
  field_item_grace_s: 45.0
  absence_grace_s: 6.0       # how long something must be unseen before it counts as missing
  alert_cooldown_s: 45.0
domain: healthcare
